[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-shala-worker"
version = "0.1.0"
description = "LiveKit voice interviewer and trusted transcript worker"
requires-python = ">=3.12"
dependencies = [
  "livekit-agents[deepgram,cartesia,openai,silero]~=1.8",
  "httpx>=0.28.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
]

[tool.setuptools]
packages = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0,<9.0.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
